<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página - GitHub</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="avatar" src="https://placehold.co/180x180" alt=".">
            <h1 class="profile-name" id="name">Sem Nome</h1>
            <h2 class="profile-username" id="username">@semnome</h2>
            <ul class="numbers">
                <li class="numbers-item" id="repositories">
                    <h4>Repositórios</h4>
                    0
                </li>
                <li class="numbers-item" id="followers">
                    <h4>Seguidores</h4>
                    0
                </li>
                <li class="numbers-item" id="following">
                    <h4>Seguindo</h4>
                    0
                </li>
            </ul>
            <a href="#" class="profile-link" id="github">Ver no Github</a>
        </div>
    </header>

    <script src="scripts/jquery-4.0.0.slim.js.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
